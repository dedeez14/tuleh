name: Build & Release

# Setiap push ke main: baca versi dari frontend/package.json. Bila belum ada
# Release untuk versi itu, build installer Windows (.exe) + Android (.apk) lalu
# terbitkan Release vX.Y.Z otomatis. Idempoten — versi yang sudah dirilis dilewati,
# jadi hanya kenaikan versi yang memicu Release baru.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(jq -r .version frontend/package.json)" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.v.outputs.version }} sudah ada — dilewati."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v${{ steps.v.outputs.version }} belum ada — build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: version-check
    if: needs.version-check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        continue-on-error: true
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build gateway Go (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p frontend/build/backend
          if command -v go >/dev/null 2>&1; then
            (cd backend && go build -o ../frontend/build/backend/mpos-backend.exe .)
            echo "Gateway dibundel."
          else
            echo "Go tidak tersedia — build tanpa gateway lokal."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (frontend)
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build installer Windows
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            frontend/dist/Tuleh-Setup-*.exe
            frontend/dist/Tuleh-Setup-*.exe.blockmap
          if-no-files-found: error

  android:
    needs: version-check
    if: needs.version-check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Rakit www/ (renderer + qrcode + demo shim + overlay mobile)
        run: |
          set -e
          RENDERER=frontend/src/renderer
          SRCMAIN=frontend/src/main
          WWW=mobile/www
          rm -rf "$WWW"; mkdir -p "$WWW/js/lib"
          cp -r "$RENDERER/." "$WWW/"
          cp "$SRCMAIN/lib/qrcode-generator.js" "$WWW/js/lib/qrcode-generator.js"
          wrap() { { echo "window.__cjs.define('$1', function (module, exports, require) {"; cat "$2"; echo ""; echo "});"; } > "$3"; }
          wrap demo-data "$SRCMAIN/demo-data.js" "$WWW/js/demo-data.js"
          wrap demo      "$SRCMAIN/demo.js"      "$WWW/js/demo.js"
          cp -r mobile/www-src/. "$WWW/"
      - name: Install deps (mobile)
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Capacitor add android + ikon/splash
        working-directory: mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android
      - name: Gradle assembleDebug
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain
      - name: Beri nama APK sesuai versi
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "Tuleh-${{ needs.version-check.outputs.version }}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Tuleh-*-android-debug.apk
          if-no-files-found: error

  release:
    needs: [version-check, desktop, android]
    if: needs.version-check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Terbitkan Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: Tuléh v${{ needs.version-check.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/desktop/*
            artifacts/android/*
