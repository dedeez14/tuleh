name: Build & Release (Android Flutter)

# Rilis khusus aplikasi Android BARU (Flutter, di mobile-flutter/). TERPISAH dari
# release.yml (desktop .exe + Android Capacitor lama) agar dua alur tak bentrok:
# tag di sini "flutter-vX.Y.Z" (versi dari mobile-flutter/pubspec.yaml), sedangkan
# release.yml memakai "vX.Y.Z" (frontend/package.json). Setiap push yang menyentuh
# mobile-flutter/ → bila versi pubspec belum dirilis, build APK release (split-per-abi,
# ter-tandatangan keystore rilis) lalu terbitkan Release. Idempoten.

on:
  push:
    branches: [main]
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/flutter-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # Ambil "X.Y.Z" dari "version: X.Y.Z+build" di pubspec.
        run: |
          RAW=$(grep -E '^version:' mobile-flutter/pubspec.yaml | awk '{print $2}')
          echo "version=${RAW%%+*}" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "flutter-v${{ steps.v.outputs.version }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release flutter-v${{ steps.v.outputs.version }} sudah ada — dilewati."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release flutter-v${{ steps.v.outputs.version }} belum ada — build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version-check
    if: needs.version-check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
      - uses: android-actions/setup-android@v3
      - name: Pasang platform Android 36 (override compileSdk 36 utk flutter_secure_storage 11)
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
      - name: flutter pub get
        run: flutter pub get
      - name: Codegen (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Cek keystore rilis
        id: ks
        # Tanda tangan STABIL (keystore rilis) wajib agar update bisa dipasang di atas
        # versi lama. Tanpa secret → jatuh ke debug signing (tak bisa auto-update).
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - name: Decode keystore rilis
        if: steps.ks.outputs.has == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tuleh-release.keystore"
      - name: Build APK release (split-per-abi)
        # build.gradle.kts membaca env ANDROID_KEYSTORE_PATH/KS_PASS/KEY_ALIAS/KEY_PASS
        # bila key.properties tak ada. Bila keystore kosong → debug signing (peringatan).
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tuleh-release.keystore
          ANDROID_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ "${{ steps.ks.outputs.has }}" != "true" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 kosong — APK ter-tandatangan debug; auto-update tak akan bisa menimpa versi lama."
          fi
          flutter build apk --release --split-per-abi
      - name: Beri nama APK sesuai versi
        run: |
          VER="${{ needs.version-check.outputs.version }}"
          OUT=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="$OUT/app-$abi-release.apk"
            [ -f "$SRC" ] && cp "$SRC" "Tuleh-$VER-$abi.apk"
          done
          ls -la Tuleh-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-android
          path: mobile-flutter/Tuleh-*.apk
          if-no-files-found: error

  release:
    needs: [version-check, android]
    if: needs.version-check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Ambil catatan rilis dari CHANGELOG
        # Isi Release = SEMUA bagian "## X.Y.Z" sejak rilis terakhir yang terbit,
        # bukan hanya versi ini. Push beruntun membuat sebagian run rilis
        # dibatalkan saat masih antre (aturan concurrency GitHub), jadi versi di
        # tengah tak pernah punya Release sendiri — catatannya tetap harus sampai
        # ke pengguna. Empat baris pertama tampil di banner pembaruan aplikasi.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.version-check.outputs.version }}"
          # Versi rilis Flutter terakhir yang sudah terbit (kosong bila belum ada).
          TERAKHIR=$(gh release list -R "${{ github.repository }}" --limit 60 \
            --json tagName --jq '[.[] | select(.tagName | startswith("flutter-v"))][0].tagName' 2>/dev/null || true)
          TERAKHIR="${TERAKHIR#flutter-v}"
          echo "Rilis terakhir: ${TERAKHIR:-(belum ada)} — sekarang: $VER"
          awk -v v="$VER" -v sejak="$TERAKHIR" '
            # Kumpulkan bagian dari versi ini ke bawah sampai bertemu versi yang
            # sudah pernah terbit.
            /^## /{
              if ($2 == v) { aktif = 1; print; next }
              if (aktif && sejak != "" && $2 == sejak) { aktif = 0; next }
              if (aktif) { print; next }
              next
            }
            aktif { print }
          ' mobile-flutter/CHANGELOG.md | sed -e '/./,$!d' > catatan.md
          # Satu versi saja: judulnya mubazir (nama Release sudah memuat versi).
          if [ "$(grep -c '^## ' catatan.md || echo 0)" = "1" ]; then
            sed -i '1{/^## /d}' catatan.md
            sed -i -e '/./,$!d' catatan.md
          fi
          if [ -s catatan.md ]; then echo "Catatan rilis $VER:"; cat catatan.md; else echo "::warning::CHANGELOG tak punya bagian $VER"; fi
      - name: Terbitkan Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-v${{ needs.version-check.outputs.version }}
          name: Tuléh Android (Flutter) v${{ needs.version-check.outputs.version }}
          body_path: catatan.md
          generate_release_notes: true
          files: artifacts/flutter-android/*
