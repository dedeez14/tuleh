<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <!-- Renderer tidak boleh bicara ke jaringan sama sekali (connect-src via default-src 'none');
       semua HTTP dilakukan main process. Gambar produk https diizinkan.
       'unsafe-inline' HANYA untuk atribut style (bar chart dinamis dll.) — script tetap 'self' ketat. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; base-uri 'none'; form-action 'none'" />
