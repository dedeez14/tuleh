  <!-- Splash animasi (paint pertama WebView; disembunyikan app.js saat siap). -->
  <style>
    #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
      background:radial-gradient(circle at 50% 36%,#ffffff,#eafaf4 58%,#d2efe6);transition:opacity .5s ease,visibility .5s ease}
    #splash.is-hidden{opacity:0;visibility:hidden}
    #splash .splash-logo{width:60vw;max-width:232px;height:auto;filter:drop-shadow(0 16px 30px rgba(18,70,60,.22));animation:splash-in .7s cubic-bezier(.16,1,.3,1) both,splash-float 3.4s ease-in-out .7s infinite}
    #splash .splash-bar{width:56vw;max-width:220px;height:5px;border-radius:999px;background:rgba(18,80,66,.14);overflow:hidden}
    #splash .splash-bar>i{display:block;height:100%;width:42%;border-radius:999px;background:linear-gradient(90deg,#22b894,#7ae2cf);animation:splash-slide 1.15s ease-in-out infinite}
    #splash .splash-text{color:#2f5b50;font:600 13px/1 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;letter-spacing:.06em;opacity:.9}
    @keyframes splash-in{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
    @keyframes splash-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes splash-slide{0%{transform:translateX(-125%)}55%{transform:translateX(130%)}100%{transform:translateX(320%)}}
  </style>
</head>
